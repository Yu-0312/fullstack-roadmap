name: Link check

# 學習路線圖引用大量外部資源，連結很容易失效；每月檢查一次，PR 時也檢查。
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200..=299,403,429
            --exclude-loopback
            './**/*.html' './**/*.md' './**/*.js'
          fail: true
