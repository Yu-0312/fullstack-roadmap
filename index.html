<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="前後端雙軌全端養成計畫 — 以前置條件與過關條件推進的學習追蹤器，含畢業專案與面試準備軌。">
<meta name="color-scheme" content="light dark">
<title>雙軌全端養成計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDEFEB;
  --surface:#FFFFFF;
  --surface-2:#F5F7F2;
  --ink:#181C19;
  --ink-2:#4B554D;
  --muted:#7A847C;
  --line:#D7DBD3;
  --line-soft:#E6E9E2;
  --core:#3E4A63;
  --core-soft:#E2E6EF;
  --fe:#0F6A5B;
  --fe-soft:#DCEBE5;
  --be:#98492A;
  --be-soft:#F3E3D9;
  --cap:#5B4A8C;
  --cap-soft:#E6E1F1;
  --int:#983A5F;
  --int-soft:#F3DEE6;
  --shadow:0 1px 2px rgba(24,28,25,.05), 0 8px 24px -16px rgba(24,28,25,.35);
  --radius:10px;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,monospace;
  --display:"Archivo","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --body:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131614;
    --surface:#1B1F1C;
    --surface-2:#222723;
    --ink:#E8EBE6;
    --ink-2:#B2BAB4;
    --muted:#828C85;
    --line:#2F3531;
    --line-soft:#272C28;
    --core:#95A6CE;
    --core-soft:#242B39;
    --fe:#5CC0AB;
    --fe-soft:#16302B;
    --be:#E0946B;
    --be-soft:#33231A;
    --cap:#A992E0;
    --cap-soft:#272040;
    --int:#E88DAE;
    --int-soft:#38202B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#131614;
  --surface:#1B1F1C;
  --surface-2:#222723;
  --ink:#E8EBE6;
  --ink-2:#B2BAB4;
  --muted:#828C85;
  --line:#2F3531;
  --line-soft:#272C28;
  --core:#95A6CE;
  --core-soft:#242B39;
  --fe:#5CC0AB;
  --fe-soft:#16302B;
  --be:#E0946B;
  --be-soft:#33231A;
  --cap:#A992E0;
  --cap-soft:#272040;
  --int:#E88DAE;
  --int-soft:#38202B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.wrap:last-of-type{padding-bottom:72px}

/* ── header ─────────────────────────────── */
header.top{
  padding:44px 0 4px;
}
.eyebrow{
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 10px;
}
h1{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(28px,4.4vw,44px);
  line-height:1.12;
  letter-spacing:-.015em;
  margin:0 0 12px;
  text-wrap:balance;
}
.lede{
  margin:0;
  max-width:62ch;
  color:var(--ink-2);
  font-size:15.5px;
}
.meter-row{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  gap:28px;
  margin-top:26px;
}
.big-pct{
  font-family:var(--display);
  font-weight:700;
  font-size:52px;
  line-height:.9;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.big-pct span{font-size:22px;font-weight:600;color:var(--muted)}
.meter-meta{
  font-family:var(--mono);
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}
.meter-meta b{color:var(--ink-2);font-weight:500}
.rail{
  flex:1 1 320px;
  min-width:240px;
  height:8px;
  border-radius:99px;
  background:var(--line-soft);
  overflow:hidden;
  display:flex;
}
.rail i{display:block;height:100%;transition:width .35s ease}

/* ── track summary cards ────────────────── */
.tracks{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  margin:28px 0 0;
}
.tcard{
  background:var(--surface);
  padding:16px 18px 18px;
  display:flex;
  flex-direction:column;
  gap:8px;
  text-align:left;
  border:0;
  cursor:pointer;
  font:inherit;
  color:inherit;
  transition:background .15s ease;
}
.tcard:hover{background:var(--surface-2)}
.tcard[aria-selected="true"]{background:var(--surface-2)}
.tcard-top{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:99px;flex:none}
.tcard h3{
  font-family:var(--display);
  font-size:15px;
  font-weight:600;
  margin:0;
  letter-spacing:.01em;
}
.tcard .kv{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  font-variant-numeric:tabular-nums;
}
.tbar{height:4px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.tbar i{display:block;height:100%;transition:width .35s ease}

/* ── sticky nav ─────────────────────────── */
.navbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--ground);
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  margin-top:32px;
}
.navbar-in{
  max-width:1140px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.02em;
  padding:6px 12px;
  border-radius:99px;
  border:1px solid transparent;
  background:transparent;
  color:var(--ink-2);
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-current="true"]{
  background:var(--surface);
  border-color:var(--line);
  color:var(--ink);
  font-weight:600;
  box-shadow:var(--shadow);
}
.navbar .spacer{flex:1}
.ghost{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--muted);
  background:transparent;
  border:1px solid var(--line);
  border-radius:99px;
  padding:5px 11px;
  cursor:pointer;
}
.ghost:hover{color:var(--ink);border-color:var(--ink-2)}
#syncNote{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ── layout ─────────────────────────────── */
.grid{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:44px;
  margin-top:34px;
  align-items:start;
}
@media (max-width:900px){
  .grid{grid-template-columns:1fr;gap:22px}
  aside{display:none}
}
aside{position:sticky;top:64px}
.aside-h{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 10px;
}
.idx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.idx a{
  display:flex;
  align-items:baseline;
  gap:8px;
  padding:5px 8px;
  border-radius:6px;
  text-decoration:none;
  color:var(--ink-2);
  font-size:13px;
  border-left:2px solid transparent;
}
.idx a:hover{background:var(--surface-2);color:var(--ink)}
.idx code{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:38px}
.idx .pc{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── intro block ────────────────────────── */
.brief{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px 22px;
  margin-bottom:30px;
  box-shadow:var(--shadow);
}
.brief h2{
  font-family:var(--display);
  font-size:16px;
  margin:0 0 10px;
  font-weight:600;
}
.brief p{margin:0 0 10px;color:var(--ink-2);font-size:14px}
.brief p:last-child{margin-bottom:0}
.split{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px 26px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--line);
}
.split div{font-size:13.5px;color:var(--ink-2)}
.split b{
  display:block;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:500;
  margin-bottom:3px;
}

/* ── phase ──────────────────────────────── */
.track-head{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin:0 0 6px;
  flex-wrap:wrap;
}
.track-head h2{
  font-family:var(--display);
  font-size:24px;
  font-weight:700;
  letter-spacing:-.01em;
  margin:0;
}
.track-head .tag{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:99px;
}
.track-sub{margin:0 0 26px;color:var(--ink-2);font-size:14px;max-width:64ch}

.phase{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:0;
  margin-bottom:14px;
  overflow:hidden;
  scroll-margin-top:76px;
}
.ph-head{
  display:flex;
  gap:14px;
  align-items:flex-start;
  padding:16px 20px 12px;
  border-bottom:1px solid var(--line-soft);
}
.code{
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:.06em;
  padding:3px 8px;
  border-radius:5px;
  flex:none;
  margin-top:2px;
}
.ph-title{flex:1;min-width:0}
.ph-title h3{
  font-family:var(--display);
  font-size:17px;
  font-weight:600;
  margin:0 0 2px;
  letter-spacing:-.005em;
}
.ph-title p{margin:0;color:var(--ink-2);font-size:13.5px}
.ph-num{
  flex:none;
  text-align:right;
  font-family:var(--mono);
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  line-height:1.5;
}
.ph-num strong{display:block;color:var(--ink);font-weight:600;font-size:13px}
.ph-bar{height:3px;background:var(--line-soft)}
.ph-bar i{display:block;height:100%;transition:width .3s ease}

ul.items{list-style:none;margin:0;padding:8px 20px 6px}
ul.items li{margin:0}
label.item{
  display:flex;
  gap:11px;
  align-items:flex-start;
  padding:7px 0;
  cursor:pointer;
  font-size:14.5px;
  line-height:1.6;
  border-bottom:1px solid var(--line-soft);
}
ul.items li:last-child label.item{border-bottom:0}
label.item input{position:absolute;opacity:0;width:0;height:0}
.box{
  flex:none;
  width:17px;height:17px;
  margin-top:3px;
  border:1.5px solid var(--line);
  border-radius:5px;
  display:grid;
  place-items:center;
  transition:background .15s ease,border-color .15s ease;
}
.box svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:opacity .15s ease,transform .15s ease}
label.item input:checked ~ .box svg{opacity:1;transform:scale(1)}
label.item input:focus-visible ~ .box{outline:2px solid currentColor;outline-offset:2px}
label.item input:checked ~ .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--line)}
.txt{color:var(--ink)}

.ph-foot{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px 24px;
  padding:14px 20px 18px;
  background:var(--surface-2);
  border-top:1px solid var(--line-soft);
}
.ph-foot section{font-size:13.5px;color:var(--ink-2)}
.ph-foot h4{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:500;
  margin:0 0 4px;
}
.ph-foot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ph-foot a:hover{border-bottom-color:currentColor}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res a{
  font-family:var(--mono);
  font-size:11.5px;
  padding:2px 8px;
  border:1px solid var(--line);
  border-radius:99px;
  border-bottom-width:1px;
}
footer.end{
  margin-top:46px;
  padding-top:20px;
  border-top:1px solid var(--line);
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <p class="eyebrow" id="eyebrow">以過關推進，不以週數推進</p>
    <h1>雙軌全端養成計畫</h1>
    <p class="lede">這裡沒有日期，只有前置條件與過關條件。每個階段標了它需要先學會什麼，做出產出物、達到過關條件才勾 —— 進度快慢不重要，重要的是每一格都是真的會了。勾選的標準永遠是同一句：不查資料就能講出來。</p>
    <div class="meter-row">
      <div>
        <div class="big-pct" id="bigPct">0<span>%</span></div>
      </div>
      <div class="rail" id="bigRail"></div>
      <div class="meter-meta" id="bigMeta">已完成 <b>0</b> / 0 個學習項目 · 約 <b>0</b> / 632 小時</div>
    </div>
    <div class="tracks" id="tracks"></div>
  </header>
</div>

<nav class="navbar">
  <div class="navbar-in">
    <div class="seg" id="seg"></div>
    <div class="spacer"></div>
    <span id="syncNote">本機儲存</span>
    <button class="ghost" id="resetBtn" type="button">重設進度</button>
  </div>
</nav>

<div class="wrap">
  <div class="grid">
    <aside>
      <p class="aside-h">階段索引</p>
      <ul class="idx" id="idx"></ul>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const PLAN = [
{
  id:"core", code:"CORE", name:"共同地基", hue:"core", weeks:"4 個階段 · 40 小時 · 全部先修", hours:40,
  sub:"兩軌共用的前置作業，四個階段都過關才往下走。這裡不碰框架，只把「電腦怎麼跑、程式碼怎麼管、請求怎麼走」弄清楚 —— 之後所有的除錯速度都靠這裡。",
  phases:[
    {id:"C1", title:"命令列與檔案系統", weeks:"前置：無", hours:10,
     goal:"能不靠圖形介面完成一天的檔案工作，並用 shell 管理自己的檔案與筆記資料夾。",
     items:["cd / ls / mv / cp / mkdir / rm 與相對絕對路徑","管線與重導向：grep、find、wc、sort、| 與 > 的組合","檔案權限、chmod、擁有者概念","環境變數、PATH、~/.zshrc 與 alias 設定","把一組常用的多步驟操作寫成 shell script（只用前面學過的指令串起來，不需要程式語言基礎）","用 grep + find 在一整個資料夾裡搜出所有含特定關鍵字的檔案"],
     out:"一份自己的 dotfiles（.zshrc + 3 個常用 alias），和一支能跑的 vault 整理腳本。",
     check:"能用一行指令回答「哪些筆記三個月沒動過」，不查資料。",
     res:[["MIT Missing Semester","https://missing.csail.mit.edu/"],["The Linux Command Line","https://linuxcommand.org/tlcl.php"]]},
    {id:"C2", title:"Git 與 GitHub 版本控制", weeks:"前置：C1", hours:12,
     goal:"把 Git 當成安全網而不是咒語，能獨立處理分支與衝突。",
     items:["commit 的三個區域：working tree / staging / repository","branch、merge、rebase 的差別與各自適用時機","解衝突：實際製造一次衝突並手動解掉","reset / revert / stash / reflog 救援四件套","PR 流程：fork、review、squash merge、commit message 規範",".gitignore、大檔處理、把既有專案推上 GitHub"],

     check:"誤刪的 commit 能在 5 分鐘內用 reflog 找回來。",
     res:[["Pro Git（中文）","https://git-scm.com/book/zh-tw/v2"],["GitHub Skills","https://skills.github.com/"]]},
    {id:"C3", title:"一個網址背後發生的事", weeks:"前置：C1", hours:10,
     goal:"能完整說出從按 Enter 到畫面出現之間的每一步，這是前後端共用的世界觀。",
     items:["DNS 解析、TCP 握手、TLS 加密的角色分工","HTTP 請求與回應的結構：method、headers、body、status code","狀態碼語意：2xx/3xx/4xx/5xx 各自代表誰的錯","快取機制：Cache-Control、ETag、瀏覽器快取 vs CDN","瀏覽器渲染流程：parse → style → layout → paint → composite","用 DevTools Network 面板逐一對照上述每一步"],
     out:"一張自己畫的「請求生命週期」圖，存進自己的筆記系統，並與後續筆記互相連結。",
     check:"看到 304、401、502 能立刻說出該去哪一層找問題。",
     res:[["MDN HTTP","https://developer.mozilla.org/zh-TW/docs/Web/HTTP"],["High Performance Browser Networking","https://hpbn.co/"]]},
    {id:"C4", title:"開發環境與除錯心法", weeks:"前置：C2", hours:8,

     out:"一個「除錯日誌」筆記資料夾，一開始就要累積到 3 則。",
     check:"下次遇到同類錯誤，先查自己的筆記就能解決。",
     res:[["VS Code Docs","https://code.visualstudio.com/docs"],["MDN 開發工具","https://developer.mozilla.org/zh-TW/docs/Learn/Common_questions/Tools_and_setup"]]}
  ]
},
{
  id:"fe", code:"FE", name:"前端軌", hue:"fe", weeks:"9 個階段 · 262 小時", hours:262,
  sub:"從沒有任何工具的 HTML 開始，一路到框架。順序是刻意的：語言核心（FE3）在框架之前，工具鏈（FE5）在需要安裝套件之前，TypeScript（FE6）在 React 之前 —— 每個階段只會用到前面教過的東西。",
  phases:[

/* ── state ─────────────────────────────── */
const KEY = "fullstack-tracker-v1";
let done = {};
let dbRef = null;
let view = "core";

const ITEM_IDS = [];
PLAN.forEach(t => t.phases.forEach(p => p.items.forEach((_,i) => ITEM_IDS.push(p.id + "-" + i))));
const TOTAL_ITEMS = ITEM_IDS.length;
const TOTAL_HOURS = PLAN.reduce((s,t) => s + t.hours, 0);
const TOTAL_PHASES = PLAN.reduce((s,t) => s + t.phases.length, 0);
document.getElementById("eyebrow").textContent =
  PLAN.length + " 條軌 · " + TOTAL_PHASES + " 個階段 · " + ITEM_IDS.length + " 個能力點 · 以過關推進，不以週數推進";

try { const raw = localStorage.getItem(KEY); if (raw) done = JSON.parse(raw) || {}; } catch (e) {}

function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {}
  if (dbRef) dbRef.set({ done: done, updatedAt: new Date().toISOString() }).catch(() => {});
}

/* ── helpers ───────────────────────────── */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const phaseDone = p => p.items.reduce((n,_,i) => n + (done[p.id+"-"+i] ? 1 : 0), 0);
function trackStats(t){
  let di = 0, ti = 0, dh = 0;
  t.phases.forEach(p => {
    const d = phaseDone(p);
    di += d; ti += p.items.length;
    dh += p.hours * (d / p.items.length);
  });
  return { di, ti, dh, pct: ti ? Math.round(di/ti*100) : 0 };
}

document.getElementById("bigRail").innerHTML = PLAN.map(t =>

const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.4 4.3 9.2 10.5 2.8"/></svg>';

function phaseHTML(p, hue){
  const d = phaseDone(p), n = p.items.length, pct = Math.round(d/n*100);
  return `<article class="phase" id="${p.id}">
    <div class="ph-head">
      <span class="code" style="background:var(--${hue}-soft);color:var(--${hue})">${p.id}</span>
      <div class="ph-title"><h3>${esc(p.title)}</h3><p>${esc(p.goal)}</p></div>
      <div class="ph-num"><strong data-phnum="${p.id}">${d}/${n}</strong>${esc(p.weeks)} · ${p.hours}h</div>
    </div>
    <div class="ph-bar"><i data-phbar="${p.id}" style="background:var(--${hue});width:${pct}%"></i></div>
    <ul class="items">${p.items.map((it,i) => {
      const id = p.id + "-" + i;
      return `<li><label class="item"><input type="checkbox" data-id="${id}" ${done[id]?"checked":""}>
        <span class="box" style="color:var(--${hue});${done[id]?`background:var(--${hue}-soft);border-color:var(--${hue})`:""}">${CHECK}</span>
        <span class="txt">${esc(it)}</span></label></li>`;
    }).join("")}</ul>
    <div class="ph-foot">
      <section><h4>產出物</h4>${esc(p.out)}</section>
      <section><h4>過關條件</h4>${esc(p.check)}</section>
      ${p.res.length ? `<section><h4>資源</h4><span class="res">${p.res.map(r =>
        `<a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])}</a>`).join("")}</span></section>` : ""}
    </div>
  </article>`;
}

    <div><b>一個階段的四步</b>讀最少的必要文件 → 立刻動手做產出物 → 講給別人（或請 Claude 抽考）→ 隔幾天不看筆記重做關鍵部分</div>
    <div><b>兩軌怎麼並行</b>前端與後端交錯著走，因為它們互相解釋。想一次專心一條也可以，但不要整條學完才碰另一條</div>
    <div><b>卡住的處理</b>先自己撞 20 分鐘 → 查官方文件 → 才問人或 AI；問完一定要關掉答案自己重寫一次</div>
    <div><b>永遠不要跳過</b>產出物。看完影片、跟著打完一次教學程式碼，都還不算學會</div>
  </div>
  <p style="margin-top:14px"><b>「熟練」的三個層次</b>，每個項目都要走到第三層才算勾完：查著文件寫得出來 → 不查文件寫得出來 → 能對別人解釋為什麼這樣做、以及還有哪些選項。面試考的永遠是第三層，而第三層只有靠「講出來」才練得到。</p>
  <p style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)"><b>會忘記是正常的</b>，所以計畫裡放了三種回頭機制：刷題的錯題在第 1、7、30 天各重做一次；每個階段的產出物在下個階段結束時回頭改一版；學過的東西全部要在畢業專案裡真的用上一次。用過三遍的東西，面試時才叫得出來。</p>
</div>`;

function render(){
  const t = PLAN.find(x => x.id === view);
  document.getElementById("main").innerHTML =
    `<div class="track-head"><h2>${esc(t.name)}</h2>
      <span class="tag" style="background:var(--${t.hue}-soft);color:var(--${t.hue})">${esc(t.weeks)}</span></div>
     <p class="track-sub">${esc(t.sub)}</p>
     ${view === "core" ? BRIEF : ""}
     ${t.phases.map(p => phaseHTML(p, t.hue)).join("")}`;

  document.getElementById("idx").innerHTML = t.phases.map(p => {
    const d = phaseDone(p), n = p.items.length;
    return `<a href="#${p.id}"><code>${p.id}</code><span>${esc(p.title)}</span><span class="pc">${d}/${n}</span></a>`;
  }).join("");

  document.querySelectorAll("[data-view]").forEach(b => {
    const on = b.dataset.view === view;
    if (b.hasAttribute("aria-current")) b.setAttribute("aria-current", on);
    if (b.hasAttribute("aria-selected")) b.setAttribute("aria-selected", on);
  });
  updateNumbers();
}

function updateNumbers(){
  let di = 0, dh = 0;
  PLAN.forEach(t => {
    const s = trackStats(t);
    di += s.di; dh += s.dh;
    const bar = document.querySelector(`[data-bar="${t.id}"]`);
    if (bar) bar.style.width = s.pct + "%";
    const rail = document.querySelector(`[data-rail="${t.id}"]`);
    if (rail) rail.style.width = (s.di / TOTAL_ITEMS * 100) + "%";
    const c = document.querySelector(`[data-count="${t.id}"]`);
    if (c) c.textContent = s.di + " / " + s.ti + " 項";
    const pc = document.querySelector(`[data-pct="${t.id}"]`);
    if (pc) pc.textContent = s.pct + "%";
  });
  document.getElementById("bigPct").innerHTML = Math.round(di/TOTAL_ITEMS*100) + "<span>%</span>";
  document.getElementById("bigMeta").innerHTML =
    `已完成 <b>${di}</b> / ${TOTAL_ITEMS} 個學習項目 · 約 <b>${Math.round(dh)}</b> / ${TOTAL_HOURS} 小時`;
}

/* ── events ────────────────────────────── */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav){ view = nav.dataset.view; render(); window.scrollTo({top:0,behavior:"smooth"}); }
});

document.addEventListener("change", e => {
  const cb = e.target.closest("input[data-id]");
  if (!cb) return;
  const id = cb.dataset.id;
  if (cb.checked) done[id] = true; else delete done[id];
  const t = PLAN.find(x => x.id === view);
  const box = cb.parentElement.querySelector(".box");
  box.style.background = cb.checked ? `var(--${t.hue}-soft)` : "";
  box.style.borderColor = cb.checked ? `var(--${t.hue})` : "";
  const p = t.phases.find(p => id.startsWith(p.id + "-"));
  if (p){
    const d = phaseDone(p), n = p.items.length;
    const num = document.querySelector(`[data-phnum="${p.id}"]`);
    if (num) num.textContent = d + "/" + n;
    const pb = document.querySelector(`[data-phbar="${p.id}"]`);
    if (pb) pb.style.width = Math.round(d/n*100) + "%";
    const link = document.querySelector(`#idx a[href="#${p.id}"] .pc`);
    if (link) link.textContent = d + "/" + n;
  }
  updateNumbers();
  persist();
});

let armed = false;
const resetBtn = document.getElementById("resetBtn");
resetBtn.addEventListener("click", () => {
  if (!armed){
    armed = true;
    resetBtn.textContent = "確定清除全部？";
    setTimeout(() => { armed = false; resetBtn.textContent = "重設進度"; }, 4000);
    return;
  }
  done = {}; armed = false; resetBtn.textContent = "重設進度";
  persist(); render();
});

render();

/* ── sync ──────────────────────────────── */
(async () => {
  if (!window.claude || !window.claude.use) return;
  let db;
  try { db = await window.claude.use("db"); } catch (e) { return; }
  if (!db) return;
  const note = document.getElementById("syncNote");
  try {
    const ref = db.doc("progress/main");
    const snap = await ref.get();
    if (snap.exists){
      const remote = snap.data().done;
      if (remote && typeof remote === "object"){
        done = Object.assign({}, remote, done);
      }
    }
    dbRef = ref;
    note.textContent = "已同步";
    render();
    if (Object.keys(done).length) persist();
  } catch (e) {
    note.textContent = "本機儲存";
  }
})();
</script>
